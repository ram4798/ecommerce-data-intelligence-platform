global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: pipeline_quality
    metrics_path: /quality.prom
    static_configs:
      - targets: ["metrics:80"]
  - job_name: pipeline_stages
    static_configs:
      - targets: ["metrics:80"]
        labels: {stage_file: batch_delta}
      - targets: ["metrics:80"]
        labels: {stage_file: streaming_delta}
      - targets: ["metrics:80"]
        labels: {stage_file: warehouse_sources}
      - targets: ["metrics:80"]
        labels: {stage_file: dbt_marts}
      - targets: ["metrics:80"]
        labels: {stage_file: dbt_documentation}
      - targets: ["metrics:80"]
        labels: {stage_file: quality_gate}
      - targets: ["metrics:80"]
        labels: {stage_file: publish_serving}
    relabel_configs:
      - source_labels: [stage_file]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /${1}.prom
