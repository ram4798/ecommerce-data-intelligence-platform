name: Python CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m ecommerce.generate --orders 1000 --output data/raw/orders.csv
      - run: |
          cp .env.example .env
          docker compose up -d --wait postgres
          RUN_DB_TESTS=1 python -m unittest discover -s tests -p test_postgres.py -v
      - if: always()
        run: docker compose down -v
