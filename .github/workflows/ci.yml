name: Python CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-stream.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m ecommerce.generate --orders 1000 --output data/raw/orders.csv
      - run: |
          cp .env.example .env
          docker compose up -d --wait postgres
          RUN_DB_TESTS=1 python -m unittest discover -s tests -p test_postgres.py -v
      - run: |
          docker compose -f compose.yaml -f compose.kafka.yaml up -d --wait kafka
          RUN_STREAM_TESTS=1 python -m unittest discover -s tests -p test_stream_integration.py -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -r requirements-lakehouse.txt
      - run: RUN_LAKEHOUSE_TESTS=1 python -m unittest discover -s tests -p test_lakehouse.py -v
        env:
          SPARK_LOCAL_IP: 127.0.0.1
      - run: pip install -r requirements-orchestration.txt
      - run: RUN_ORCHESTRATION_TESTS=1 python -m unittest discover -s tests -p test_warehouse.py -v
      - run: RUN_ORCHESTRATION_TESTS=1 python -m unittest discover -s tests -p test_quality.py -v
      - run: |
          docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro" --entrypoint /bin/promtool prom/prometheus:v3.2.1 check config /etc/prometheus/prometheus.yml
      - run: pip install -r requirements-app.txt
      - run: RUN_APP_TESTS=1 python -m unittest discover -s tests -p test_api.py -v
      - run: RUN_APP_TESTS=1 python -m unittest discover -s tests -p test_assistant.py -v
      - run: RUN_APP_TESTS=1 python -m unittest discover -s tests -p test_phase9.py -v
      - if: always()
        run: docker compose -f compose.yaml -f compose.kafka.yaml down -v
